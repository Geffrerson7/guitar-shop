name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un PR que recibe un push nuevo cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Versión de pnpm fijada aquí porque package.json no declara
      # `packageManager`. Mantener alineada con la versión local.
      PNPM_VERSION: 12.18.0
      # Base de datos del servicio `postgres` (Fase 8): la usan las pruebas de
      # integración de la capa de datos, el build (prerender) y las E2E.
      DATABASE_URL: postgresql://guitarshop:guitarshop@localhost:5432/guitarshop

    # Misma versión mayor que docker-compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: guitarshop
          POSTGRES_PASSWORD: guitarshop
          POSTGRES_DB: guitarshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guitarshop -d guitarshop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `postinstall` ejecuta `prisma generate`.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Migraciones (prisma migrate deploy)
        run: pnpm db:deploy

      - name: Datos iniciales (seed)
        run: pnpm db:seed

      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint + jsx-a11y)
        run: pnpm lint

      - name: Tipos (tsc --noEmit)
        run: pnpm typecheck

      - name: Pruebas unitarias (Vitest)
        run: pnpm test

      - name: Build de producción
        run: pnpm build

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Caché de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Dependencias del sistema para Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Pruebas de extremo a extremo y accesibilidad (Playwright + axe)
        run: pnpm test:e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
